version: "3.9"

services:
  api:
    build: .
    container_name: heart-disease-api
    command: python3 -m uvicorn server.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  dashboard:
    build: .
    container_name: heart-disease-dashboard
    command: python3 -m streamlit run dashboard/app.py --server.headless true --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
